<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK RPG - Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="split-screen">

        <div class="left-side">
            <div class="banner-content">
                <h1>AFK RPG</h1>
                <p class="tagline">Level up get stronger, even when you're away!</p>
            </div>
        </div>

        <div class="right-side">
            <div class="form-container">
                <h2>Forgot Password</h2>
                <p class="subheading">Enter your username and email to request a reset link.</p>

                <p id="form-error" class="footer-text" style="color:#f87171; display:none;"></p>

                <form action="forgot-password.php" method="POST">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <button type="submit" class="action-btn">Request Reset Link</button>

                    <p class="footer-text"><a href="login.html">Back to Login</a></p>
                </form>
            </div>
        </div>

    </div>

    <script>
        const ERROR_MESSAGES = {
            missing_fields: "Please fill in both fields.",
            account_not_found: "No account matches that username and email.",
        };
        const params = new URLSearchParams(window.location.search);
        const errorCode = params.get('error');
        if (errorCode) {
            const el = document.getElementById('form-error');
            el.textContent = ERROR_MESSAGES[errorCode] || "Something went wrong. Please try again.";
            el.style.display = 'block';
        }
    </script>
</body>
</html>
